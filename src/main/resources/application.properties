spring.application.name=MobileBackEndJava
server.port=${PORT:8080}
server.address=0.0.0.0

# Logging Configuration
logging.level.root=INFO
logging.level.org.example.mobilebackendjava=DEBUG
logging.level.org.springframework.security=INFO

# Jackson Date Format
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# VNPay Gateway Configuration (Read from Environment Variables with SandBox Fallbacks)
vnpay.tmnCode=${VNPAY_TMN_CODE:4YUP19I4}
vnpay.hashSecret=${VNPAY_HASH_SECRET:MDUIFDCRAKLNBPOFIAFNEKFRNMFBYEPX}
vnpay.payUrl=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.returnUrl=${VNPAY_RETURN_URL:https://backendmobile-lqh7.onrender.com/api/vnpay-return}

# Actuator Health & Metrics
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
